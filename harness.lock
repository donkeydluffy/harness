        "MOD-06": "sha256:33d87ec516d7a4efa65f776f6abce89f86d6f7f8d00f47a164b6a262c8dae59d",
        "MOD-11": "sha256:3ea03925ca4334f9286b1804c7062b8baf505b5452b4e5f21dff353e2bd5e253",
