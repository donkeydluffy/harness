      "text": "### FLOW-10 锁定\n- Covers: FR-004, FR-041, FR-047, FR-048\n- Steps: MOD-01 -> IF-023, MOD-02 -> IF-009, MOD-02 -> IF-012, MOD-02 -> IF-029, MOD-02 -> IF-005, MOD-02 -> IF-006\n\nRelease 2：锁文件为 Release 1 格式时经 IF-029 Migrate 迁移为按单位批准，并删除 phase 字段。",
