      "text": "### NFR-001 确定性\n- Release: 1\n- Type: Constraint\n- Priority: P0\n\n所有检查不调用大模型，相同输入产生相同输出。\n\n- AC-N001-1: 除 `harness audit deps` 外，检查工具不发起任何网络请求。\n  - AC-N001-1/N1: 在断网环境运行全部检查子命令，结果与联网时一致\n  - AC-N001-1/E1: 源码静态测试：除 audit 包外引入 `net/http` 等网络包时 harness 自身构建失败",
