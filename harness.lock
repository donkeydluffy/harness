      "text": "### FLOW-12 接口快照\n- Covers: FR-052\n- Steps: MOD-01 -> IF-039, MOD-02 -> IF-009, MOD-02 -> IF-035\n\n`harness snapshot`：app 对 sourcePaths 内的 Go 文件提取锚点声明，按接口编号排序写入 `docs/architecture/interfaces.txt`。",
