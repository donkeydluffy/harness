      "text": "### FLOW-03 命令执行后比对\n- Covers: FR-012\n- Steps: MOD-01 -> IF-019, MOD-01 -> IF-025, MOD-02 -> IF-017, MOD-11 -> IF-018, MOD-01 -> IF-019\n\nPreToolUse(Bash) 放行时 gate 调用 Before 记录状态；PostToolUse(Bash) 时调用 After，恢复范围外改动并把恢复清单反馈给代理。",
