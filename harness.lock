      "text": "### IF-032 Smoke\n- Module: MOD-16\n- Covers: FR-055\n\n```go\n// IF-032\n// Smoke 运行项目配置的冒烟测试命令，返回退出码与输出的最后 50 行（AC-055-2）。\nfunc Smoke(s *workspace.Snapshot) (exit int, tail []string, err error)\n```",
