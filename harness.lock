    "docs/architecture/modules/MOD-09-workspace.md#正文": {
      "at": "2026-11-26T12:17:55Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:7a63f14b65f0f60497d3f05cad935150b84d338ac5fb9d9931d548b47193972d",
      "text": "# MOD-09 workspace 详细设计\n\n## 职责\n\n一次性加载规则和门禁需要的全部输入，形成只读快照。规则只读快照，不自行读文件，便于样本测试和性能控制。\n\n## 接口\n\n## 内部设计\n\n门禁路径（PreToolUse）只用 `LoadOptions{}`，不读测试报告和源码，以满足 NFR-003 的 200ms。",
      "upstream": {}
    },
    "docs/architecture/modules/MOD-10-phase.md#正文": {
      "at": "2026-11-26T12:17:55Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:4e6e6fc196cb9d0297cc097cafd4f5d8e0177d35678d81353e252cebd9d1ce3d",
      "text": "# MOD-10 phase 详细设计\n\nRelease 2 删除本模块（FR-048）：`Current-Release` 改为 2 时与 `internal/phase/` 一起删除，模块 Status 改为 Removed。\n\n## 接口\n\n## 规则\n\n本模块注册规则 `phase.01`：阶段定义合法、规则编号存在、阶段名不重复；移除内置规则须引用 ADR。\n\n## 内置阶段\n\n| 阶段 | 可写产物 | 退出规则 |\n|---|---|---|\n| requirements | `docs/PRD.md`, `docs/prd/**`, `docs/research/**` | prd.*, term.01, approve.01 |\n| architecture | 上一阶段 + `docs/architecture/**`, `docs/adr/**` | arch.*, trace.*, adr.*, approve.01 |\n| planning | 上一阶段 + `docs/tasks.md`, `docs/debt.md` | task.01 ~ task.06 |\n| implementation | 上一阶段 + `docs/progress.md` | 全部规则 |\n\n源码写入不受可写产物路径约束，由 FR-012 的任务范围判定。",
      "upstream": {}
    },
    "docs/architecture/modules/MOD-11-gate.md#正文": {
      "at": "2026-11-26T12:17:56Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:8060578eef7e3f5e8a6dd2678440fca079bd4158fa763aff161ce18ca22a85c4",
      "text": "# MOD-11 gate 详细设计\n\n## 接口\n\n## 判定顺序\n\n1. `gate.protect`：写入锁文件、`harness.json`、hook 配置，或产物状态行改为 Approved，或执行 `harness approve` → 拒绝。\n2. `gate.sensitive`：读写敏感路径 → 拒绝（`sensitiveAllow` 除外）。\n3. `gate.secret`：写入内容命中密钥规则 → 拒绝。\n4. `gate.command`：危险命令 → 拒绝；命令中解析出的写入目标按第 5、6 步判定。\n5. `gate.write`：源码写入须有 InProgress 任务、路径在其范围内，且该任务的批准链（IF-028 Chain）全部有效；失效时拒绝并列出失效单位与原因（AC-047-4）。\n6. 放行。`docs/` 下的产物任何时候都可写（AC-048-2），Release 1 的 `gate.artifact` 删除。\n\n## Bash 命令解析\n\n用 `mvdan.cc/sh/v3/syntax` 解析命令（ADR-003）：重定向目标、`tee`、`cp`、`mv`、`rm`、`touch`、`mkdir`、`sed -i`、`git checkout -- <path>`、`git restore` 的路径参数作为写入目标。无法静态判定的命令（脚本、解释器）放行到执行，由 IF-018 事后比对。\n\n## 结束检查\n\n`session_start` 注入 IF-028 Summarize 的批准状态摘要与建议的 skill（AC-048-3），取代当前阶段。\n\n`stop` 请求运行全量检查；同一会话连续拒绝次数存于 `.harness/session/<会话>.json`，达到 `stopMaxBlocks` 后放行，并把未通过项写入 `docs/progress.md` 的\"未完成\"段。",
      "upstream": {}
    },
    "docs/architecture/modules/MOD-12-adapter.md#正文": {
      "at": "2026-11-26T11:11:28Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:eb1a119c8f7c8913824f0a4009361a1875bfcd5b7bc73e8f170a3dbbaac3a0f8",
      "text": "# MOD-12 adapter 详细设计\n\n## 接口\n\n## claudecode 适配器\n\n| 事件 | 请求 | 输出 |\n|---|---|---|\n| SessionStart | session_start | `additionalContext` 注入 |\n| PreToolUse（Read/Edit/Write/MultiEdit/NotebookEdit/Bash） | read / write / command | 拒绝时 `permissionDecision: \"deny\"` |\n| PostToolUse（Edit/Write/MultiEdit/Bash） | post_write | 反馈检查结果；Bash 后执行 IF-018 After |\n| Stop | stop | 拒绝时 `decision: \"block\"` |\n\nDecode 失败时判定为拒绝（AC-012-5/E1），hook 配置设置 `onFailure: \"block\"`。\n\nDecode 填写 Request.Root 与 Cwd：Cwd 取 hook 输入中的 cwd（缺失时为进程当前目录），Root 从 Cwd 向上查找含 `harness.json`、`docs/PRD.md` 或 `.git` 的目录。`harness gate` 以 Root 为根加载快照、保存命令前快照与会话状态，与 hook 进程的当前目录无关；代理的 shell 停在子目录时，判定仍覆盖整个仓库。",
      "upstream": {}
    },
    "docs/architecture/modules/MOD-13-scaffold.md#正文": {
      "at": "2026-11-26T12:17:56Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:fad600f3958a4e4154b1211862e10b729f116ede61771f2987e6e8bee677611d",
      "text": "# MOD-13 scaffold 详细设计\n\n## 接口\n\n## 规则\n\n本模块注册规则 `cfg.02`：生成文件与 IF-021 的期望内容一致；本地 harness 是发布版且与 CI 固定版本不同时，报告两个版本并提示重新生成（AC-051-3）。\n\n## 模板\n\n`internal/scaffold/templates/`：\n\n- `artifacts/`：PRD、架构总览、formats、ADR、tasks、debt、progress 骨架。\n- `skills/<名称>/SKILL.md`：clarify（需求）、change（需求变更）、architect（设计）、plan（任务）、implement（实现）、test（测试）。每个 skill 的 frontmatter 声明结束前运行的 `harness check` 子命令；正文不再提阶段（FR-048）。\n- `agents/<代理>/`：hook 配置模板。\n- `ci/`：GitHub Actions、GitLab CI。用户项目下载固定版本的发布归档并用 checksums.txt 校验（AC-051-1，ADR-012），依次运行 `harness check lint`、`harness check smoke`、`harness check`、`harness check commits`（AC-014-7、AC-055-2）；harness 自身仓库仍从源码构建。\n- `langs/<语言>/files/`：工具配置文件（如 `ruff.toml`、`.prettierrc`、`.clang-format`）。\n- `githooks/`：commit-msg、pre-commit。",
      "upstream": {}
    },
    "docs/architecture/modules/MOD-14-lang.md#正文": {
      "at": "2026-11-26T12:17:57Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:ebfe01961855fe077c315eb514debcfbe8af63b9e2467514eb3a9b8a76cb944e",
      "text": "# MOD-14 lang 详细设计\n\n## 职责\n\n语言相关知识的唯一位置：文件归属、注释提取（区分字符串字面量）、测试分类。新增语言是扩展点 EXT-01。\n\n## 接口\n\n## 内部设计\n\n- `internal/lang/registry.go` 只包含各语言包的注册调用，每种语言一行。\n- Release 1 提供 `internal/lang/golang/`：用 `go/scanner` 提取注释；`*_integration_test.go` 或含 `//go:build integration` 的文件为集成测试。\n- Release 2：五种语言都实现 Packer（原 `internal/scaffold/templates/langs/<语言>/pack.json` 的数据移入各语言包）；只有 Go 实现 Analyzer：`go/parser` 解析 import 与声明，`go test -run <pattern> -coverprofile -coverpkg=./...` 采集覆盖率。",
      "upstream": {}
    },
    "docs/architecture/modules/MOD-15-approval.md#正文": {
      "at": "2026-11-26T12:17:58Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:244d6904a9693e290d6b0ed44a1dce519fb6b9cd9b6d629eee8f487091b9da80",
      "text": "# MOD-15 approval 详细设计\n\n## 职责\n\n按批准单位（TERM-027）计算内容哈希、批准链与批准状态，生成批准记录（ADR-009）。只读快照，不写文件；写锁文件由 app 完成。\n\n## 接口\n\n## 内部设计\n\n- 单位的范围：需求为 FR、NFR 实体（含其验收标准与用例）；术语为统一语言表格的一行；待澄清项、设计元素（MOD、IF、FLOW、EXT）、ADR、任务为各自的实体；每个产物文件中实体之外的文字为 `<文件路径>#正文`。\n- 批准前检查（IF-024 调用）：只运行待批准单位自身所在文件的结构规则、上游必须 approved（AC-047-3），以及项目登记在该单位类型上的自定义规则（AC-054-5）；不运行覆盖类规则。\n- 状态由 Evaluate 一次算出并缓存于调用方，门禁路径只为当前 InProgress 任务调用 Chain，保持 NFR-003 的耗时要求。",
      "upstream": {}
    },
    "docs/architecture/modules/MOD-16-toolrun.md#正文": {
      "at": "2026-11-26T12:17:58Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:ae60c95c8bbe113708c99453efb796d12d0c24d13bfd1e44aa283dbc9991e9f9",
      "text": "# MOD-16 toolrun 详细设计\n\n## 职责\n\n运行外部工具（格式化与静态检查、按接口的单元测试与覆盖率、冒烟测试），把结果写成报告。全量检查不调用本模块，只读取报告（ADR-011）。\n\n## 接口\n\n## 内部设计\n\n- 工具输出解析由语言配置包声明（IF-034 的 `Tool.Output`）：`files` 每行一个文件名（如 `gofmt -l`），`lines` 为 `文件:行[:列]: 消息`。项目覆盖的命令按 `lines` 解析；命令退出码非 0 而没有解析出问题时，记一条不带文件的问题，消息为输出的最后 20 行。\n- 命令通过 `sh -c` 在项目根运行；命令的第一个词在 PATH 中找不到时返回 MissingTool，不写报告。\n- 源码哈希由 IF-009 的 `SourceHash` 计算，报告与当前源码的哈希不同即过期。",
      "upstream": {}
    },
    "docs/architecture/modules/MOD-17-custom.md#正文": {
      "at": "2026-11-26T12:17:59Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:3914eb9ec09f9ac5641223a8475b458cd0bd76c9d933429c260075be53ca0569",
      "text": "# MOD-17 custom 详细设计\n\n## 职责\n\n把 `harness.json` 的 `rules` 构造为实现 IF-011 的规则，校验编号、样本与批准前检查登记（FR-054）。外部命令规则在 Release 3（FR-046），本模块不运行外部程序。\n\n## 接口\n\n## 内部设计\n\n- 四类规则：`required` 实体缺字段；`enum` 字段值不在 Values 中；`ref` 字段引用的编号不存在；`forbid` 匹配 Paths 的文件中出现 Pattern，逐行报告。\n- 样本目录与规则定义一起纳入锁文件（formats.md 第 7 节 `rule:<编号>`），修改后需 `harness lock`（AC-054-2）。",
      "upstream": {}
    },
    "docs/architecture/modules/MOD-18-version.md#正文": {
      "at": "2026-11-26T12:18:00Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:8464cb5af9757704f1d9f0e813471a4186360d9487ce315162d89efd8a1f0e4c",
      "text": "# MOD-18 version 详细设计\n\n## 接口\n\n## 内部设计\n\n- 叶子模块，只用 `runtime/debug.ReadBuildInfo`。发布配置（`.goreleaser.yaml`，MOD-01）注入 `internal/version.injected`。\n- `go install module@v0.2.0` 构建的二进制，模块版本为 `v0.2.0`，输出去掉前缀 `v`。",
      "upstream": {}
    },
    "docs/architecture/overview.md#正文": {
      "at": "2026-11-26T12:17:50Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:37fb46f6d0086ddf771419732e98cc0f3f1d20c00c59d197aaccd4706b0f90d5",
      "text": "# 架构总览：harness\n\n- Updated: 2026-11-26\n- PRD: 1.0-rc3\n\n本文件是概要设计：模块划分、依赖、扩展点。每个模块的接口签名和内部设计见 `docs/architecture/modules/`，跨模块调用流程见 `docs/architecture/flows.md`，产物格式见 `docs/architecture/formats.md`，架构决策见 `docs/adr/`。\n\n## 1. 分层与依赖\n\n```\nL4 入口   MOD-01 cli ──▶ app, adapter, version\nL3 编排   MOD-02 app\nL2 能力   MOD-13 scaffold ──▶ adapter, lang, version\n          MOD-11 gate ──────▶ approval, engine            MOD-12 adapter ──▶ gate ◀ EXT-02\n          MOD-16 toolrun ───▶ testreport, lang\n          MOD-17 custom ────▶ engine                      （项目自定义规则）\n          MOD-05 builtin ───▶ engine, approval + L0        ◀ EXT-03\n          MOD-04 engine\n          MOD-15 approval ──▶ workspace, lock, model\n          MOD-10 phase（Release 2 删除；app、gate、scaffold 对它的依赖随之去掉） ◀ EXT-04\nL1 加载   MOD-09 workspace\nL0 基础   MOD-03 model · MOD-06 lock · MOD-07 vcs · MOD-08 testreport · MOD-14 lang ◀ EXT-01 · MOD-18 version\n```\n\n依赖规则（与第 2 节各模块的 Depends 字段一致，以 Depends 字段为准）：\n\n- 叶子模块（model、lock、vcs、testreport、lang、version）不依赖任何模块。\n- workspace 只依赖叶子模块，负责一次性加载项目快照。\n- engine 只依赖 workspace；approval 依赖 workspace 与叶子模块；builtin（内置规则）依赖 engine、approval 和叶子模块；custom 依赖 engine。\n- gate、scaffold、toolrun 依赖其下各层，不互相依赖。\n- app 是唯一的编排层；cli 只依赖 app、adapter 和 version。\n\n## 2. 模块\n\n## 3. 扩展点",
      "upstream": {}
    }
  },
  "version": 2
}
