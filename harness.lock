    "ADR-010": {
      "at": "2026-11-26T12:18:02Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:9ea7d0d9687f7018cbab1fbb7363f508df68d3c204f7cb3ec7816df42695127d",
      "text": "# ADR-010 项目规则不再挂在阶段上\n\n- Status: Accepted\n- Relates: FR-054, FR-048, NFR-009, MOD-04, MOD-17, EXT-03\n\n## 背景\n\nADR-005 让项目通过 `harness.json` 的 `phases` 给阶段追加规则，并用 `x.` 前缀区分项目规则。阶段删除后（ADR-009），规则需要新的挂载点；PRD 的 AC-054-4 也改为用项目自己的前缀（如 `acme.01`）。\n\n## 决策\n\n- 项目规则在全量检查中与内置规则一起运行；登记了 `approveFor` 的规则，还会在批准该类单位时作为批准前检查运行。\n- 规则编号沿用 `<区域>.<序号>`；项目前缀不得与内置规则的区域相同，由 MOD-17 在加载时校验。\n- 声明式规则由独立模块 MOD-17 构造，engine 只认 IF-011。被否决的方案：放进 engine，那样 engine 要理解项目配置，扩展内置规则时就不再是封闭的。\n- 本决策取代 ADR-005。内置规则的注册方式（每条规则一个文件，registry.go 中一行）不变。\n\n## 后果\n\n- 外部命令规则（FR-046）在 Release 3 加到 MOD-17，不改 engine。\n- `x.` 前缀的旧写法仍然合法：`x` 不是内置区域。",
      "upstream": {
        "EXT-03": "sha256:61989a0087c4eb8717f00f41928d2e64c53a65f20be33a695a5be38fda4bbc60",
        "FR-048": "sha256:d5976659ffb61d8f3eccb9b6485c47a203e34d6851cfed05a049a7e1eee21189",
        "FR-054": "sha256:383913c520d024c7aef642f0291b857bf8374102dda6f21c270ce55bbfcfa2d5",
        "MOD-04": "sha256:a0a66bc2f337694fb46d9d2578c481e8fbc1f3771e2d497c0b53f0bd877db38e",
        "MOD-17": "sha256:e6c8dee6cfaef8ac554487264153743764f3d46aa1f987eee1f6c1c3b568857b",
        "NFR-009": "sha256:bb584f2fce654615747908041237da4c8986f24501043907160c58ca6ed16a51"
      }
    },
    "ADR-011": {
      "at": "2026-11-26T12:18:02Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:fe6b0c17c10123a9ee6a40ab8473bb5630a1aeb7345028321c3d76e18bd04b22",
      "text": "# ADR-011 外部工具只在专用命令中运行，全量检查读报告\n\n- Status: Accepted\n- Relates: FR-014, FR-021, FR-055, MOD-02, MOD-08, MOD-16, FLOW-11\n\n## 背景\n\nlint、按接口的覆盖率、冒烟测试都要运行外部程序，耗时长，结果还依赖本机环境。全量检查会在任务完成和每次会话结束时运行，必须快，而且结果确定。\n\n## 决策\n\n- `harness check lint`、`harness check unit` 运行工具，并把结果连同源码哈希写入 `.harness/reports/`；全量检查只读报告：报告缺失、过期或有问题时失败。测试报告沿用同样做法。\n- 冒烟测试不写报告、不计入全量检查，只在 `harness check smoke` 与 CI 中运行。\n- 被否决的方案：在全量检查中直接运行工具。会话结束检查会因此变慢，工具没装时还会挡住与源码无关的检查。\n\n## 后果\n\n- 代理改完源码要先运行 `harness check lint` 和 `harness check unit`，否则报告过期；失败信息会提示运行哪个命令。\n- 报告不提交到仓库，CI 中重新生成。\n- app 新增对 MOD-14、MOD-15、MOD-16、MOD-17 的依赖：编排外部工具报告、接口快照、批准与自定义规则。",
      "upstream": {
        "FLOW-11": "sha256:4cca329d02de900b1a828292b24b8a40d81b8dc600170e6d6a8b03f32b6e7bbe",
        "FR-014": "sha256:70e2b7d6a6c115130fa8d01556eb3a64ae67df8080201f3521ecbe5df6416b0c",
        "FR-021": "sha256:35cf3ac36aa7a588c2cab7b6f2992dad02fc680207cd606adf39ea6409287da4",
        "FR-055": "sha256:c0093cbbf518e4e135a6ec7c338fcb1cb5db63100c5ac91716dd18d51520baf6",
        "MOD-02": "sha256:211bfe509cfb1b226b4d8a30a92bb2530e4c73cfd9110596edc5d0e6fcde94d5",
        "MOD-08": "sha256:26ddba11c4df1845817a8e9ad863426254d5f825f7bf06e82e226665a3df9c98",
        "MOD-16": "sha256:8d746428ba215e9b4a580acbc234fc84b265004637eff503ccfaade6a1502366"
      }
    },
    "ADR-012": {
      "at": "2026-11-26T12:18:03Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:c53cab7a410a2099680b259efed231858a7784246eb1257b9c375e8c8f08b640",
      "text": "# ADR-012 Release 2 的代码分析只做 Go；CI 下载固定版本\n\n- Status: Accepted\n- Relates: FR-050, FR-051, FR-052, FR-053, FR-035, MOD-01, MOD-13, MOD-14, MOD-18, EXT-01\n\n## 背景\n\n依赖约束、接口签名、机械改动校验都要解析源码。每种语言的 import 与声明解析是一套独立的工作，而 harness 自身是 Go 项目，只有 Go 能在自举中得到真实验证。另外，用户项目的 CI 用 `go install @latest` 安装 harness，版本会漂移，CI 里还得装 Go。\n\n## 决策\n\n- MOD-14 的 Analyzer 是语言的可选接口，Release 2 只有 Go 实现（`go/parser`、`go test -coverprofile`）；其他语言没有 Analyzer 时，相关规则跳过并在输出中说明。\n- 接口签名快照提交到 `docs/architecture/interfaces.txt`，签名变化在评审 diff 中可见；规则 if.02 保证快照与源码一致。被否决的方案：只在检查时临时提取。锁文件比对仍然可行，但人在 diff 中看不到签名变化。\n- 用户项目的 CI 下载生成时版本的发布归档，并用 checksums.txt 校验。harness 没有发布版本号时，init 拒绝生成。被否决的方案：`go install module@<版本>`，需要 Go 工具链，而且从源码构建，结果与发布包不完全相同。\n\n## 后果\n\n- NFR-006（新增语言）改到 Release 3；新增语言时实现 Packer 与 Analyzer，规则不改。\n- 升级 harness 后需要重新运行 `harness init`，更新 CI 中固定的版本；cfg.02 会提示。\n- cli 依赖 MOD-18 取当前版本，用于 `harness version` 与 init；EXT-01 的扩展路径加入 `internal/scaffold/templates/langs/<语言>/**`，新增语言时连同工具配置文件一起提供。",
      "upstream": {
        "EXT-01": "sha256:b6da69e42eca8e5d262cfe5561f63dab65f61ed1e2ae73293a38113333887d8e",
        "FR-035": "sha256:73c6fb37ae06b7e007adeebd7aa4452f68d2cba1efe70a790fd032b3ce559ae0",
        "FR-050": "sha256:816ac65f0cc05099c0ea0f75ae029ef40ac4ad4b821812fa2fd60df7668f566c",
        "FR-051": "sha256:5b19968302a9e20d4ae9e11bc13f88c21da0553654e0c2daf767a7bac2bcb16a",
        "FR-052": "sha256:8489677566027f291fd7cd00fa595d467c7d366834c42251dbde7a8f8fa06cfb",
        "FR-053": "sha256:cc50039cd3243ab909132397cdc4c457a2bceb209f80df4ce78d85e1c64e4b7b",
        "MOD-01": "sha256:1257dbb473c20fbfa97a8e8ec5203cbb22fcd7e179e065e1ee3f8e6124723b53",
        "MOD-13": "sha256:31fbc3f0b021329efbeb71bae494e34070df03cb8313497040686d26f2e77f6a",
        "MOD-14": "sha256:d8165a32323af9461fb66747a4cc715e281efc6ab3ac905e7a202b774d3f2fea",
