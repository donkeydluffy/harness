# 由 harness init 生成。修改后 harness check（规则 cfg.02）会失败；需要调整时删除本文件并重新运行 harness init。
name: harness
on: [push, pull_request]
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
{{install}}{{testSteps}}      - name: harness check lint
        run: harness check lint
      - name: harness check unit
        run: harness check unit
      - name: harness check smoke
        run: harness check smoke
      - name: harness check
        run: harness check
      - name: harness check commits
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then RANGE="origin/$BASE_REF..HEAD"
          else case "$BEFORE" in ""|0000000*) RANGE="HEAD~1..HEAD" ;; *) RANGE="$BEFORE..HEAD" ;; esac
          fi
          harness check commits "$RANGE"
