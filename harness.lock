      "hash": "sha256:1a31becf33af95adb0f365cd64f6e9e3e96e2945538f6eac0b0225cc78728e61",
      "text": "### IF-001 ParseMarkdown\n- Module: MOD-03\n- Covers: FR-003, FR-006, FR-019\n\n```go\n// IF-001\n// ParseMarkdown 把单个 Markdown 文件解析为实体列表，同时保留表格行和代码块。\nfunc ParseMarkdown(path string, src []byte) (*Doc, []Diagnostic)\n\ntype Doc struct {\n\tPath     string\n\tHeader   map[string]string // 文件头字段，如 Status、Current-Release\n\tEntities []*Entity\n\tTables   []Table           // 表格，每行带行号\n}\n\ntype Entity struct {\n\tID     string            // FR-001、MOD-04……\n\tKind   string            // 由前缀推得：FR、NFR、MOD、IF……\n\tTitle  string\n\tFields map[string]string\n\tItems  []Item            // 列表项：AC 与其下缩进的用例\n\tCode   []CodeBlock\n\tFile   string\n\tLine   int\n\tRaw    string            // 实体完整文本，用于哈希\n}\n\ntype Diagnostic struct{ File string; Line int; Msg string }\n```",
      "upstream": {
        "FR-003": "sha256:311889ffbb147673106c37d513855ddb1c1c4b4dfd0876bf499df2eea340183a",
        "FR-006": "sha256:9ada3a326d4333e1185fb2a06684196e93dcd4df1dc737b30c387857ce8c7fb1",
        "FR-019": "sha256:684dd2a5cad1347eb024405c3ba952f8d24e28866d1fab1dd03f0c3e8417867e"
