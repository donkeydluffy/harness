  "units": {
    "ADR-001": {
      "at": "2026-11-26T03:45:59Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:7163bb89a9c9ec64cc94c66f2ad507b3e9387b135da21584b9bc4e1a9ca44c2b",
      "text": "# ADR-001 检查工具用 Go 单二进制实现\n\n- Status: Accepted\n- Relates: NFR-001, NFR-002, MOD-01\n\n## 背景\n\n检查工具要在每个使用 harness 的项目、三种操作系统、CI 中直接运行，且门禁单次耗时 < 200ms（NFR-003）。\n\n## 决策\n\n用 Go 实现，编译为单个静态二进制；模板通过 `go:embed` 打包。除 ADR-003 外不引入第三方依赖。\n\n## 后果\n\n- 分发只需一个文件；不要求目标机器安装 Python 或 Node。\n- 需要为 6 个平台交叉编译与发布（AC-N002-1）。\n- 不引入 YAML 与 Markdown 库，解析器自行实现（见 ADR-002）。",
      "upstream": {
        "MOD-01": "sha256:1257dbb473c20fbfa97a8e8ec5203cbb22fcd7e179e065e1ee3f8e6124723b53",
        "NFR-001": "sha256:1911852aba790868f7710b86cea99d8d53be3ebf5798e35911202b40a76b5911",
        "NFR-002": "sha256:1b9aa8ae4773d700beffc7653f801c01e1099f0b972001acfd7cc51db2976598"
      }
    },
    "ADR-002": {
      "at": "2026-11-26T03:46:00Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:8e10529630e6b8606ddaeddebf6948907c2d7f3fcb0008b0fc6e63a9ca1ed311",
      "text": "# ADR-002 产物用 Markdown 字段格式，配置用 JSON\n\n- Status: Accepted\n- Relates: NFR-005, FR-003, FR-006, MOD-03, MOD-09\n\n## 背景\n\n产物既要人直接编辑、git diff 可读，又要被确定性解析。可选：全部 Markdown、Markdown + YAML、JSON。\n\n## 决策\n\n所有产物用 Markdown，机器读取\"编号标题 + `- Key: value` 字段\"结构（`docs/architecture/formats.md`）。项目配置 `harness.json` 与锁文件 `harness.lock` 用 JSON，由 Go 标准库解析。\n\n## 后果\n\n- 一个解析器覆盖 PRD、架构、ADR、任务、技术债；零第三方依赖。\n- JSON 配置不能写注释，说明写在 `docs/architecture/formats.md`。\n- 字段格式的语法错误由 MOD-03 以 Diagnostic 报告，规则 `prd.01`、`arch.01` 等给出修复建议。",
      "upstream": {
        "FR-003": "sha256:311889ffbb147673106c37d513855ddb1c1c4b4dfd0876bf499df2eea340183a",
        "FR-006": "sha256:9ada3a326d4333e1185fb2a06684196e93dcd4df1dc737b30c387857ce8c7fb1",
        "MOD-03": "sha256:883a4c34a8a77463576b6781c5902a0b88160e8781f727e1d7e58ac8ba4fa491",
        "MOD-09": "sha256:523726963342b4fd051abf966c133ccf1d21b7727d71bd57aadb828fc7758e61",
        "NFR-005": "sha256:8c6e97162d13b996cf104fff991888a065588f6914468955a6cbe963273f0f0e"
      }
    },
    "ADR-003": {
      "at": "2026-11-26T03:46:01Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:50a0f48d68c8731ab5dbc5cad840ea9b76de3ee0091acea0c488eceb1d049746",
      "text": "# ADR-003 Bash 写入判定：事前解析加事后比对\n\n- Status: Accepted\n- Relates: FR-012, FR-025, MOD-11\n\n## 背景\n\n代理可以用任意命令写文件（重定向、`sed -i`、`python -c`、构建脚本）。只做事前解析会漏掉解释器和脚本；只做事后比对拦不住仓库外的写入和危险命令。\n\n## 决策\n\n- 事前：用 `mvdan.cc/sh/v3/syntax` 解析命令，识别重定向和已知写命令的目标路径，按门禁规则拒绝。\n- 事后：放行的命令执行前记录仓库文件状态，执行后比对，范围外的改动恢复为执行前内容，新建文件删除，并反馈给代理。\n- 引入第三方依赖 `mvdan.cc/sh/v3`（BSD-3-Clause），这是 ADR-001 唯一的例外。\n\n## 后果\n\n- 覆盖任意写法；事后恢复只作用于仓库内文件。\n- 事前快照需要遍历仓库文件元数据，大仓库的耗时由 NFR-003 基准测试约束；大于 1 MiB 的文件只记录元数据，被改动时报告但不恢复。\n- 依赖登记在依赖白名单（FR-026 于 Release 2 生效时补录）。",
      "upstream": {
        "FR-012": "sha256:03b9f97ca31ebd3c8e2cb152872fa4e454f14f4dff74944586c29a39b7cdbc1a",
        "FR-025": "sha256:e77c170bc282518e4e7ba9a0a8dd5c6351c858a9f0a9a5bd48da9586aebcc434",
        "MOD-11": "sha256:3ea03925ca4334f9286b1804c7062b8baf505b5452b4e5f21dff353e2bd5e253"
      }
    },
    "ADR-006": {
      "at": "2026-11-26T03:46:04Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:21e10448022e638d0867f6602dc9aee2177dd402c40e172c65916cac2806d0a5",
      "text": "# ADR-006 门禁判定与代理协议分离\n\n- Status: Accepted\n- Relates: FR-012, FR-044, NFR-007, MOD-11, MOD-12, EXT-02\n\n## 背景\n\nClaude Code、Codex、Cursor 的 hook 事件名、输入字段、拒绝方式各不相同（`docs/research/2026-11-25-landscape.md` 第 4 节），Release 3 才接入后两者。\n\n## 决策\n\n门禁判定（MOD-11）只处理与代理无关的 Request / Decision；每种代理一个适配器（MOD-12），负责事件解码、结果编码、hook 配置模板。cli 调用适配器，app 只接收 Request。\n\n## 后果\n\n- 新增代理只新增适配器目录与注册行，门禁判定保持封闭。\n- 适配器解码失败一律判定为拒绝（失败即阻断）。",
      "upstream": {
        "EXT-02": "sha256:6ece0b4f44b8a1bfd46b88f3f6f04614c9f119244fc6e5afb908212d2ad8b53a",
        "FR-012": "sha256:03b9f97ca31ebd3c8e2cb152872fa4e454f14f4dff74944586c29a39b7cdbc1a",
        "FR-044": "sha256:ed9dace11d85e669fe08a85d73f13a5758df65fb77af30baafe196e0d05bf11a",
        "MOD-11": "sha256:3ea03925ca4334f9286b1804c7062b8baf505b5452b4e5f21dff353e2bd5e253",
        "MOD-12": "sha256:4120593ffdd8bbf25a354573158c7928336628838411b055d5f596a179bad814",
        "NFR-007": "sha256:d6b55fda5bc02bae29b2132206adad058a575db0b916536a5827411fcdca56bf"
      }
    },
    "ADR-007": {
      "at": "2026-11-26T03:46:05Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:9e5f951e4faf426d8c2ea7596611674146c45233e590fdc1dffb1cf2ee062a18",
      "text": "# ADR-007 规则只读一次性加载的项目快照\n\n- Status: Accepted\n- Relates: NFR-003, FR-028, MOD-09, MOD-04\n\n## 背景\n\n规则需要产物、锁文件、git、测试报告、源码等多种输入。若各规则自行读取，难以控制性能，也难以用样本测试规则。\n\n## 决策\n\nMOD-09 一次性加载只读快照，规则只接收快照。门禁路径使用轻量快照（不读测试报告和源码）。规则样本即构造好的快照。\n\n## 后果\n\n- 规则是纯函数，样本测试简单，结果确定（NFR-001）。\n- 快照加载成为性能热点，NFR-003 的基准测试以它为主要对象。\n- 编排层通过快照间接使用叶子模块，app 扇出保持在 7 以内。",
      "upstream": {
        "FR-028": "sha256:e999dc7f3a4deda1f0e0f5376e91802fdb9cc647dfa137b108d6552be12306a4",
        "MOD-04": "sha256:a0a66bc2f337694fb46d9d2578c481e8fbc1f3771e2d497c0b53f0bd877db38e",
        "MOD-09": "sha256:523726963342b4fd051abf966c133ccf1d21b7727d71bd57aadb828fc7758e61",
        "NFR-003": "sha256:db1ded2f49600ca48257e28f4be4eb1fdc0d2d7e43dbbf66428a630c131c91ac"
      }
    },
    "ADR-008": {
      "at": "2026-11-26T03:46:07Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:6281afdaad97da7f54384b77e8c7ae719d11fb814385914f1d3e703cf98c319f",
      "text": "# ADR-008 任务可关联验收标准；根目录文件的归属\n\n- Status: Accepted\n- Relates: FR-011, FR-013, FR-039, MOD-01, FLOW-01\n\n## 背景\n\n规划 Release 1 任务时，两条已批准的规则互相卡住：\n\n- AC-039-1：任务 Done 时，所关联 FR 的全部用例必须通过。\n- AC-011-6：跨模块任务必须引用一个调用流程，涉及的模块都在流程中。\n\nFR-011、FR-013、FR-033、FR-037、FR-041、FR-045 等需求的实现横跨不在同一流程中的模块（例如规则在 MOD-05，skill 在 MOD-13）。按 FR 粒度拆分时，先完成的那部分任务永远到不了 Done；不拆则只能做成横跨 6 到 8 个模块的大任务，违背\"任务独立、不相关改动拆开\"。\n\n另外，`go.mod`、`go.sum`、发布配置以及 `harness init` 写入的配置文件不在任何模块的路径内，包含它们的任务（task.03）和提交（commit.02）都会失败。\n\nFLOW-01 原先没有列出 workspace 加载语言注册表和 git 仓库、规则调用语言接口这三步，与模块实际依赖不符。\n\n## 决策\n\n1. 任务的 Covers 可以写 FR、NFR 或 AC。完成定义只检查所关联条目涉及的用例；FR 被直接关联，或其每条 Active AC 都被关联，均视为被任务覆盖（PRD CHG-012）。\n2. `go.mod`、`go.sum`、`.goreleaser.yaml`、`.github/workflows/release.yml` 归入 MOD-01 的 Paths，MOD-01 覆盖 NFR-002。\n3. `harness init` 等命令写入的文件定义为生成文件（TERM-026），commit.02 与产物文件一样豁免；它们仍受门禁保护（gate.protect），内容由 cfg.01、cfg.02 校验。\n4. FLOW-01 补充 `MOD-09 -> IF-004`、`MOD-09 -> IF-007`、`MOD-05 -> IF-003` 三步。\n\n## 后果\n\n- 任务可以按\"一个验收标准 + 它涉及的模块\"拆分，规则任务和 skill 任务各自能到 Done。\n- task.02 的覆盖判定从\"FR 被关联\"变为\"FR 或其全部 AC 被关联\"，实现稍复杂。\n- 用 FLOW-01 承载的任务可以同时涉及 MOD-01、02、03、04、05、06、07、08、09、14。",
      "upstream": {
        "FLOW-01": "sha256:e9edeae4d9d46e0482fee120ac46051d7273717066741cbb3ecee31264583568",
        "FR-011": "sha256:7b0e8bd3c8ab7393300ec321e4c76fde05b5bf3268f56485b9a349688761b077",
        "FR-013": "sha256:79e801ce72d2545f6cfecdac599d58514edac0d42521ec3fccdd43aa7f4c83b0",
        "FR-039": "sha256:b91b973e0e29320e0d4fe7fbe9a7d6bc724eabd6e6df06f3dd57945cb2cedb60",
        "MOD-01": "sha256:1257dbb473c20fbfa97a8e8ec5203cbb22fcd7e179e065e1ee3f8e6124723b53"
      }
    },
    "ADR-009": {
      "at": "2026-11-26T12:18:01Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:b765c0d4046a8fb221799afc25ef63e30a2b65e24eb01e2feabf235941d8c11c",
      "text": "# ADR-009 按单位批准取代阶段\n\n- Status: Accepted\n- Relates: FR-047, FR-048, FR-037, MOD-06, MOD-11, MOD-15, FLOW-02, FLOW-08\n\n## 背景\n\nRelease 1 按文件批准，并用线性阶段决定什么时候能写什么。到实现阶段后阶段不再前进，代理可以随时改需求和设计；改动一条需求又会让整个 PRD 的批准失效，与之无关的任务也被卡住。\n\n## 决策\n\n- 批准单位为一条需求、术语、待澄清项、设计元素、ADR、任务，以及每个文件中条目之外的正文（TERM-027）。哈希不含 Status 字段，PRD 正文不含变更日志。\n- 批准记录放在锁文件的 `units` 中，记下批准时的内容与各上游单位的哈希。上游变化或失效时下游失效，并能说出是哪个上游引起的。\n- 批准时内容写入锁文件，`harness approve` 据此显示差异。被否决的方案：从 git 历史取上次批准时的内容。批准与提交不一一对应，按提交查找既慢又会出错。\n- 删除阶段。产物任何时候都可写；能否开工由任务的批准链决定，门禁在源码写入时检查。\n- 被否决的方案：保留阶段，增加\"退回\"命令。退回仍以整个阶段为粒度，解决不了一条需求变化牵连全部任务的问题。\n- 本决策取代 ADR-004 中关于当前阶段与按文件批准的部分；锁文件的其余约定（受保护、键排序、只由 harness 命令写入）不变。\n\n## 后果\n\n- 锁文件变大：大约是全部产物文本的规范化副本。\n- 门禁写源码时需要计算一条批准链，只算当前 InProgress 任务这一条。\n- Release 1 的锁文件由 `harness lock` 一次性迁移；MOD-10、EXT-04 在 `Current-Release` 改为 2 时删除。",
      "upstream": {
        "FLOW-02": "sha256:96c4d2ad9e0878d212fa419b9aa0d9c71cc3ff6678d21e4a7c35b360f004218d",
        "FLOW-08": "sha256:e124ecc4f24078826c4108a811af103b2623ffef24b29b3ad56e108a8b475a70",
        "FR-037": "sha256:c8b39b05b82095c7c173e7838ad232745522265f7844960adfc121db18232d2d",
