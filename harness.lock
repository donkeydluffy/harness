      "at": "2026-11-26T12:02:28Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:1b9aa8ae4773d700beffc7653f801c01e1099f0b972001acfd7cc51db2976598",
      "text": "### NFR-002 单二进制分发\n- Release: 1\n- Type: Constraint\n- Priority: P0\n\n检查工具用 Go 实现，编译为无运行时依赖的单个二进制。\n\n- AC-N002-1: 提供 macOS（arm64/amd64）、Linux（amd64/arm64）、Windows（amd64/arm64）构建。\n  - AC-N002-1/N1: 发布构建产出 6 个平台的二进制\n  - AC-N002-1/E1: 任一平台交叉编译失败时，发布流程失败\n- AC-N002-2: skill、hook 配置、rule、产物模板、语言配置包通过 go:embed 打包进二进制，`harness init` 写入项目；项目自包含，团队成员 clone 后只需安装二进制。\n  - AC-N002-2/N1: 在只安装了 harness 二进制的机器上，`harness init` 生成全部模板\n  - AC-N002-2/E1: 内嵌模板缺失（构建时被排除）时，harness 自身测试失败\n- AC-N002-3: 二进制通过 GitHub Releases 和 Homebrew tap 分发。\n  - AC-N002-3/N1: 打 tag 后，GitHub Release 包含 6 个平台的二进制和校验和\n  - AC-N002-3/N2: Homebrew tap 的 formula 版本与 tag 一致\n  - AC-N002-3/E1: Release 中某个二进制的校验和与文件不一致时，发布流程失败",
      "upstream": {}
    },
    "NFR-003": {
      "at": "2026-11-26T12:02:28Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:db1ded2f49600ca48257e28f4be4eb1fdc0d2d7e43dbbf66428a630c131c91ac",
      "text": "### NFR-003 性能\n- Release: 1\n- Type: Quantitative\n- Priority: P1\n\n- AC-N003-1: 写操作门禁（PreToolUse）单次耗时 < 200ms。\n  - AC-N003-1/N1: 5000 个源文件、200 个任务的样例仓库上，PreToolUse 门禁 p95 < 200ms\n  - AC-N003-1/E1: 超过 200ms 时性能基准测试失败\n- AC-N003-2: 5000 个源文件的仓库全量检查 < 10s。\n  - AC-N003-2/N1: 5000 个源文件的样例仓库全量检查 < 10s\n  - AC-N003-2/B1: 50000 行的 PRD 上 `harness check prd` < 2s",
      "upstream": {}
    },
    "NFR-004": {
      "at": "2026-11-26T12:02:28Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:e1b1bd48f0c4e5b94fbb27bd560f718ec2942a01c27bb2667c17a5f4ee6f03b4",
      "text": "### NFR-004 可操作的报错\n- Release: 1\n- Type: Constraint\n- Priority: P0\n\n- AC-N004-1: 每条违规包含规则编号、文件、行号、修复建议。\n  - AC-N004-1/N1: 每条违规输出含规则编号、文件、行号、修复建议\n  - AC-N004-1/E1: harness 自身测试：任一规则的违规输出缺少修复建议时失败\n- AC-N004-2: 支持 `--json` 输出；有违规时退出码非 0。\n  - AC-N004-2/N1: `--json` 输出可被 JSON 解析，字段与文本输出一致；有违规时退出码 1，无违规时 0\n  - AC-N004-2/E1: PRD 文件不可读等内部错误时退出码为 2，与\"有违规\"区分",
      "upstream": {}
    },
    "NFR-005": {
      "at": "2026-11-26T12:02:28Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:8c6e97162d13b996cf104fff991888a065588f6914468955a6cbe963273f0f0e",
      "text": "### NFR-005 产物可读可 diff\n- Release: 1\n- Type: Constraint\n- Priority: P1\n\n- AC-N005-1: 所有产物为 Markdown 或 YAML/JSON 文本，人可直接编辑，git diff 可读。\n  - AC-N005-1/N1: `harness init` 生成的全部产物扩展名为 .md、.yaml 或 .json\n  - AC-N005-1/E1: 锁文件为 JSON 并按键排序，同一状态两次生成逐字节一致",
      "upstream": {}
    },
    "NFR-006": {
      "at": "2026-11-26T12:02:28Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:16f52d4c269819d458862cb35cd5a933a52247debdacf600b680dee983247f51",
      "text": "### NFR-006 扩展场景：新增一种编程语言\n- Release: 3\n- Type: Scenario\n- Priority: P1\n- Adds: 一种项目语言的支持\n- Allowed-Paths: 该语言的语言配置包、提取器文件、语言注册表文件\n- Closed-Modules: 需求、追溯、任务、门禁\n\n新增一种项目语言的支持时，只新增该语言的语言配置包和 import/接口提取器文件，并在语言注册表中登记一行；不修改需求、追溯、任务、门禁模块。\n\n- AC-N006-1: 以示例语言实现一次扩展，提交只涉及语言配置包目录、提取器目录和注册表文件。",
      "upstream": {}
    },
    "NFR-007": {
      "at": "2026-11-26T12:02:28Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:d6b55fda5bc02bae29b2132206adad058a575db0b916536a5827411fcdca56bf",
      "text": "### NFR-007 扩展场景：新增一种编程代理\n- Release: 3\n- Type: Scenario\n- Priority: P1\n- Adds: 一种编程代理的门禁支持\n- Allowed-Paths: 该代理的 hook 适配器、配置模板、代理注册表文件\n- Closed-Modules: 门禁判定\n\n新增一种编程代理（如 Codex、Cursor 之外的代理）的门禁支持时，只新增该代理的 hook 适配器和配置模板，并在代理注册表中登记一行；不修改门禁判定逻辑。\n\n- AC-N007-1: 以示例代理实现一次扩展，提交只涉及适配器目录、模板目录和注册表文件。",
      "upstream": {}
    },
    "NFR-008": {
      "at": "2026-11-26T12:02:28Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:b16220b7b86bee9ec27abad8eb7b9d94907f483358332b93273c9edda03fa897",
      "text": "### NFR-008 扩展场景：新增一个流程阶段\n- Type: Scenario\n- Release: 1\n- Priority: P1\n- Replaced-By: FR-048\n- Adds: 一个内置流程阶段\n- Allowed-Paths: 阶段定义文件、该阶段的 skill 模板、阶段注册表文件\n- Closed-Modules: 门禁判定、规则引擎、产物解析\n\n- AC-N008-1: 以示例阶段实现一次扩展，提交只涉及阶段定义文件、skill 模板和阶段注册表文件。\n  - AC-N008-1/N1: 示例阶段的扩展提交通过 FR-034 开闭校验\n  - AC-N008-1/E1: 示例阶段的提交改动门禁判定模块时，开闭校验失败（回归测试）",
      "upstream": {}
    },
    "NFR-009": {
      "at": "2026-11-26T12:02:28Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:bb584f2fce654615747908041237da4c8986f24501043907160c58ca6ed16a51",
      "text": "### NFR-009 扩展场景：新增一条内置硬检测规则\n- Type: Scenario\n- Release: 1\n- Priority: P1\n- Adds: 一条内置规则\n- Allowed-Paths: 规则实现文件、规则样本目录、规则注册表文件\n- Closed-Modules: 规则引擎、门禁判定、产物解析、阶段\n\n- AC-N009-1: 以示例规则实现一次扩展，提交只涉及规则实现文件、规则样本目录和规则注册表文件。\n  - AC-N009-1/N1: 示例规则的扩展提交通过 FR-034 开闭校验\n  - AC-N009-1/E1: 示例规则的提交改动规则引擎模块时，开闭校验失败（回归测试）",
      "upstream": {}
    },
    "OQ-001": {
      "at": "2026-11-26T12:02:28Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:36cd7de5c9113c59a86f6b266141dcc924873a788a056dfcd4a1d451e66efb11",
      "text": "### OQ-001 是否需要 Windows 支持\n- Resolution: 支持 Windows（见 NFR-002）。",
      "upstream": {}
    },
    "OQ-002": {
      "at": "2026-11-26T12:02:28Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:43737954c079b9f2f496ff29f67b76d3d6b824dc169fc402ca8cda5060bc5d25",
      "text": "### OQ-002 第一版是否需要支持 Claude Code 以外的代理（Codex、Cursor 等）\n- Resolution: 第一版支持 Claude Code、Codex、Cursor（见 AC-012-5）。",
      "upstream": {}
    },
    "OQ-003": {
      "at": "2026-11-26T12:02:28Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:d191a8584e2467351788d7510954db99479c7869e1251994297f1b5c31134ab3",
      "text": "### OQ-003 接口的唯一来源\n- Resolution: 两者都要：设计手写签名为意图，代码提取快照为事实，不一致即失败（见 AC-009-4、FR-018）。\n\n接口签名是手写在架构声明里（与代码可能漂移），还是从代码或契约文件（OpenAPI、proto、TS 声明）提取？",
      "upstream": {}
    },
    "OQ-004": {
      "at": "2026-11-26T12:02:28Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:ed71326d5d66e4440016a3aedcd9e0d8a3c0f5888754ff4af6eb610bd2356779",
      "text": "### OQ-004 PRD 规模\n- Resolution: 允许按领域拆分，PRD.md 为索引（见 AC-003-4）。\n\n大项目是单个 PRD.md，还是允许按领域拆成多个文件（PRD 为索引）？",
      "upstream": {}
    },
    "OQ-005": {
      "at": "2026-11-26T12:02:28Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:ab4d854aec4cea5536114b6af5cba81e79181786ff5d0d9a527ebd395de97991",
      "text": "### OQ-005 \"开发人员知情\"的形式\n- Resolution: 生成 CODEOWNERS，下游模块负责人成为接口文件 owner（见 AC-009-6）。\n\n接口变更时，除了检查输出的通知清单，是否需要 CODEOWNERS 审批、PR 标签或其他通知渠道？",
      "upstream": {}
    },
    "OQ-006": {
      "at": "2026-11-26T12:02:28Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:ccae268e4512472a10aba630bd7c2b6a2d41f6f203eaa941fddffce686a2d997",
      "text": "### OQ-006 提交粒度的执行位置\n- Resolution: 本地 git hook + CI 兜底（见 AC-013-3）。\n\nFR-013 通过本地 git hook、CI，还是两者都要？",
      "upstream": {}
    },
    "OQ-007": {
      "at": "2026-11-26T12:02:28Z",
      "by": "rainbow taxi <tomyforever@gmail.com>",
      "hash": "sha256:0c0fb0a081b613cf59c778483a19af3a0ecbedea5116f23de21d0ca8b2300469",
      "text": "### OQ-007 分发方式\n- Resolution: 二进制内嵌全部模板，GitHub Releases + Homebrew tap（见 NFR-002）。\n\n二进制通过 GitHub Releases、Homebrew，还是 `go install`？skill 和 hook 是否打包为 Claude Code 插件？",
      "upstream": {}
    },
